name: Test MTG mobile fixes

on:
  push:
    branches:
      - fix/index-tiles-double-faced
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-test-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify TypeScript, tests, and lint
        run: |
          npm ci
          npm run build
          npm test
          npm run lint
      - name: Assemble isolated vault
        run: |
          set -eu
          VAULT="mtg-decklist-faces-test"
          mkdir -p "$VAULT/.obsidian/plugins/mtg-decklist"
          cp main.js styles.css manifest.json "$VAULT/.obsidian/plugins/mtg-decklist/"
          printf '["mtg-decklist"]\n' > "$VAULT/.obsidian/community-plugins.json"
          cp docs/test-index-and-double-faces.md "$VAULT/01 - Index et cartes recto-verso.md"
          cat > "$VAULT/00 - Installation Android.md" <<'EOF'
          # Installer cette version de test

          1. Téléchargez l'artefact ZIP, puis extrayez-le avec le gestionnaire de fichiers Android ou Windows.
          2. Conservez le dossier caché `.obsidian` et son plugin `mtg-decklist`.
          3. Dans Obsidian, ouvrez le dossier extrait comme **un nouveau coffre**.
          4. Autorisez les plugins communautaires **dans ce seul coffre de test**.
          5. Ouvrez la note « 01 - Index et cartes recto-verso ».

          Ce ZIP ne s'ouvre pas directement : il faut le décompresser.
          EOF
          test -s "$VAULT/.obsidian/plugins/mtg-decklist/main.js"
      - uses: actions/upload-artifact@v4
        with:
          name: mtg-decklist-faces-test
          path: mtg-decklist-faces-test/
          include-hidden-files: true
          retention-days: 7
