name: Test MTG mobile fixes

on:
  push:
    branches:
      - fix/index-tiles-double-faced
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-test-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify TypeScript, tests, and lint
        run: |
          npm ci
          npm run build
          npm test
          npm run lint
      - name: Assemble isolated vault
        run: |
          set -eu
          VAULT="mtg-decklist-faces-test"
          mkdir -p "$VAULT/.obsidian/plugins/mtg-decklist"
          cp main.js styles.css manifest.json "$VAULT/.obsidian/plugins/mtg-decklist/"
          printf '["mtg-decklist"]\n' > "$VAULT/.obsidian/community-plugins.json"
          cp docs/test-index-and-double-faces.md "$VAULT/01 - Index et cartes recto-verso.md"
          cat > "$VAULT/00 - Installation Android.md" <<'EOF'
          # Installer cette version de test

          1. Téléchargez l'artefact ZIP, puis extrayez-le avec le gestionnaire de fichiers Android ou Windows.
          2. Conservez le dossier caché `.obsidian` et son plugin `mtg-decklist`.
          3. Dans Obsidian, ouvrez le dossier extrait comme **un nouveau coffre**.
          4. Autorisez les plugins communautaires **dans ce seul coffre de test**.
          5. Ouvrez la note « 01 - Index et cartes recto-verso ».

          Ce ZIP ne s'ouvre pas directement : il faut le décompresser.
          EOF
          test -s "$VAULT/.obsidian/plugins/mtg-decklist/main.js"
      - uses: actions/upload-artifact@v4
        with:
          name: mtg-decklist-faces-test
          path: mtg-decklist-faces-test/
          include-hidden-files: true
          retention-days: 7

      - name: Package one-click ZIP (retain hidden Obsidian plugin directory)
        run: |
          zip -q -r mtg-decklist-faces-test.zip mtg-decklist-faces-test
          unzip -l mtg-decklist-faces-test.zip | grep 'mtg-decklist-faces-test/.obsidian/plugins/mtg-decklist/main.js'
          unzip -l mtg-decklist-faces-test.zip | grep 'mtg-decklist-faces-test/.obsidian/plugins/mtg-decklist/styles.css'
      - name: Attach ZIP to a clearly marked testing prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-2026-11-06
          target_commitish: ${{ github.sha }}
          name: "Android test vault — NOT a stable plugin release"
          body: |
            Coffre autonome de test pour Obsidian Android/Windows.
            Non destiné à l'installation sur le coffre principal.
            Décompresser le ZIP, conserver .obsidian, puis ouvrir le dossier comme coffre dans Obsidian.
            Contient les corrections débordement des symboles d'extensions et cartes recto/verso.
          prerelease: true
          files: mtg-decklist-faces-test.zip
          fail_on_unmatched_files: true
